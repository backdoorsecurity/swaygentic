# Project-scoped Grok Build config for grok-in-browser.
# Trust this folder (`grok --trust`) so project MCP servers load.

[mcp_servers.brave-devtools]
# Relative to project root when this folder is trusted.
command = "bash"
args = ["mcp/run_brave_mcp.sh"]
enabled = true
startup_timeout_sec = 90
tool_timeout_sec = 120
