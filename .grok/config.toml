# Project-scoped Grok Build config — advisor (browser).
# Delegate Brave → bravectl, guest → winctl. No MCP servers in this session.

[mcp]
max_output_bytes = 1500000

[mcp_servers.brave-devtools]
command = "bash"
args = ["mcp/run_brave_mcp.sh"]
enabled = false
startup_timeout_sec = 90
tool_timeout_sec = 120

[mcp_servers.winctl]
command = "bash"
args = ["mcp/winctl/launch.sh"]
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 120

[permission]
allow = []
